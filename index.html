<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Quran Bot</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f5f1e8;
      color: #222;
      font-family: "Arial", sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      border: 0;
      cursor: pointer;
    }

    /* =========================
       شاشة اختيار السور
       ========================= */

    #surahScreen {
      min-height: 100vh;
      padding: 18px 14px 30px;
    }

    .app-title {
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      margin: 8px 0 5px;
    }

    .app-subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .search-box {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid #ddd;
      background: white;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
      direction: rtl;
    }

    .surah-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .surah-button {
      background: white;
      border: 1px solid #e4e0d7;
      border-radius: 14px;
      min-height: 65px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: right;
      transition: transform 0.12s;
    }

    .surah-button:active {
      transform: scale(0.97);
    }

    .surah-number {
      width: 35px;
      height: 35px;
      min-width: 35px;
      border-radius: 50%;
      background: #eee8dc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #555;
    }

    .surah-info {
      flex: 1;
      min-width: 0;
    }

    .surah-name {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .surah-details {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    /* =========================
       شاشة المصحف
       ========================= */

    #quranScreen {
      display: none;
      min-height: 100vh;
      background: #e9e4d8;
      padding-bottom: 18px;
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 241, 232, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #d8d1c4;
      padding: 10px 12px;
    }

    .reader-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .back-button {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #fff;
      font-size: 22px;
    }

    .page-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      direction: ltr;
    }

    #pageInput {
      width: 54px;
      height: 40px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      text-align: center;
      font-size: 17px;
      outline: none;
    }

    .page-total {
      color: #777;
      font-size: 13px;
    }

    .zoom-controls {
      display: flex;
      gap: 6px;
    }

    .zoom-button {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: white;
      font-size: 22px;
      font-weight: bold;
    }

    .surah-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 9px;
    }

    .reader-content {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 12px 8px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 720px;
      transform-origin: top center;
      transition: transform 0.15s ease;
    }

    #quranPage {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      border-radius: 2px;
    }

    .reader-bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 12px 8px;
    }

    .nav-button {
      flex: 1;
      max-width: 180px;
      height: 48px;
      border-radius: 13px;
      background: white;
      font-size: 15px;
      font-weight: bold;
    }

    .nav-button:disabled {
      opacity: 0.35;
    }

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: #777;
      font-size: 15px;
    }

    .error {
      text-align: center;
      padding: 35px 15px;
      color: #a33;
      display: none;
    }

    @media (max-width: 380px) {
      .surah-list {
        grid-template-columns: 1fr;
      }

      .surah-name {
        font-size: 16px;
      }
    }
  </style>
</head>

  <!-- =====================================
       الشاشة الأولى:

  <section id="surahScreen">

    <div class="app-title">

      <div id="surahTitle" class="surah-title">

    <div class="reader-content">

    </div>


    <div class="reader-bottom">

      <button

      >
        التالية ›

  /* ==========================================
     عناصر الصفحة
     ========================================== */

  const surahScreen = document.getElementById("surahScreen");
  const quranScreen = document.getElementById("quranScreen");

  const surahList = document.getElementById("surahList");
  const searchInput = document.getElementById("searchInput");

  const surahTitle = document.getElementById("surahTitle");

  const pageInput = document.getElementById("pageInput");
  const quranPage = document.getElementById("quranPage");

  const loading = document.getElementById("loading");
  const error = document.getElementById("error");

  const pageWrapper = document.getElementById("pageWrapper");

  const prevButton = document.getElementById("prevButton");
  const nextButton = document.getElementById("nextButton");

  const backButton = document.getElementById("backButton");

  const zoomIn = document.getElementById("zoomIn");
  const zoomOut = document.getElementById("zoomOut");


  /* ==========================================
     الحالة الحالية
     ========================================== */

  let currentPage = 1;
  let currentSurah = null;

  let zoom = 1;


  /* ==========================================
     إنشاء قائمة السور
     ========================================== */

  function renderSurahs(list = surahs) {

    surahList.innerHTML = "";

    list.forEach(surah => {

      const button = document.createElement("button");

      button.className = "surah-button";
      button.type = "button";

      button.innerHTML = `
        <div class="surah-number">
          ${surah.id}
        </div>

        <div class="surah-info">

          <div class="surah-name">
            ${surah.name}
          </div>

          <div class="surah-details">
            ${surah.type} · ${surah.ayahs} آية
          </div>

        </div>
      `;

      button.addEventListener("click", () => {
        openSurah(surah);
      });

      surahList.appendChild(button);

    });
  }


  /* ==========================================
     البحث عن السورة
     ========================================== */

  searchInput.addEventListener("input", () => {

    const value = searchInput.value.trim();

    if (!value) {
      renderSurahs();
      return;
    }

    const filtered = surahs.filter(surah =>
      surah.name.includes(value) ||
      String(surah.id).includes(value)
    );

    renderSurahs(filtered);

  });


  /* ==========================================
     فتح السورة
     ========================================== */

  function openSurah(surah) {

    currentSurah = surah;

    currentPage = surah.startPage;

    zoom = 1;

    pageWrapper.style.transform = "scale(1)";

    surahScreen.style.display = "none";
    quranScreen.style.display = "block";

    surahTitle.textContent = "سُورَةُ " + surah.name;

    loadPage(currentPage);

    window.scrollTo({
      top: 0,
      behavior: "instant"
    });

  }


  /* ==========================================
     تحميل صفحة المصحف
     ========================================== */

  function loadPage(page) {

    if (page < 1) page = 1;
    if (page > 604) page = 604;

    currentPage = page;

    pageInput.value = page;

    loading.style.display = "block";
    quranPage.style.display = "none";
    error.style.display = "none";

    /*
      مصدر صفحات مصحف المدينة:

      604 صفحة.
      SVG.
      Uthmani.
      عرض 720.
    */

    const url =
      "https://api.islamic.app/v1/mushaf/page/" +
      page +
      ".svg?font=uthmani&theme=light&width=720";

    quranPage.onload = () => {

      loading.style.display = "none";

      quranPage.style.display = "block";

      updateButtons();

    };

    quranPage.onerror = () => {

      loading.style.display = "none";

      quranPage.style.display = "none";

      error.style.display = "block";

    };

    quranPage.src = url;

    updateButtons();

  }


  /* ==========================================
     أزرار السابق / التالي
     ========================================== */

  function updateButtons() {

    prevButton.disabled = currentPage <= 1;
    nextButton.disabled = currentPage >= 604;

  }


  prevButton.addEventListener("click", () => {

    if (currentPage > 1) {
      loadPage(currentPage - 1);
    }

  });


  nextButton.addEventListener("click", () => {

    if (currentPage < 604) {
      loadPage(currentPage + 1);
    }

  });


  /* ==========================================
     الانتقال إلى رقم صفحة
     ========================================== */

  pageInput.addEventListener("change", () => {

    let page = parseInt(pageInput.value, 10);

    if (isNaN(page)) {
      page = currentPage;
    }

    page = Math.max(1, Math.min(604, page));

    loadPage(page);

  });


  pageInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
      pageInput.blur();
    }

  });


  /* ==========================================
     التكبير والتصغير
     ========================================== */

  zoomIn.addEventListener("click", () => {

    zoom += 0.1;

    if (zoom > 2) {
      zoom = 2;
    }

    pageWrapper.style.transform =
      `scale(${zoom})`;

  });


  zoomOut.addEventListener("click", () => {

    zoom -= 0.1;

    if (zoom < 0.7) {
      zoom = 0.7;
    }

    pageWrapper.style.transform =
      `scale(${zoom})`;

  });


  /* ==========================================
     العودة لقائمة السور
     ========================================== */

  backButton.addEventListener("click", () => {

    quranScreen.style.display = "none";
    surahScreen.style.display = "block";

    window.scrollTo({
      top: 0,
      behavior: "instant"
    });

  });


  /* ==========================================
     السحب يمين / يسار للتنقل
     ========================================== */

  let touchStartX = 0;
  let touchEndX = 0;

  quranScreen.addEventListener("touchstart", event => {

    touchStartX = event.changedTouches[0].screenX;

  }, {passive: true});


  quranScreen.addEventListener("touchend", event => {

    touchEndX = event.changedTouches[0].screenX;

    const distance = touchEndX - touchStartX;

    if (Math.abs(distance) < 70) {
      return;
    }

    /*
      RTL:
      السحب من اليمين إلى اليسار = الصفحة التالية
      السحب من اليسار إلى اليمين = الصفحة السابقة
    */

    if (distance < 0) {

      if (currentPage < 604) {
        loadPage(currentPage + 1);
      }

    } else {

      if (currentPage > 1) {
        loadPage(currentPage - 1);
      }

    }

  }, {passive: true});


  /* ==========================================
     تشغيل التطبيق
     ========================================== */

  renderSurahs();

</script>

</body>
</html>
