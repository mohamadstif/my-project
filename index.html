<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Quran Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#f5f5f5;
    color:#222;
    font-family:Arial,"Tahoma",sans-serif;
}

button,input{
    font-family:inherit;
}

/* =========================
   قائمة السور
========================= */

#surahScreen{
    display:block;
    min-height:100vh;
    padding:20px 12px 30px;
    background:#f7f7f7;
}

.title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin:5px 0 7px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:18px;
}

.search{
    width:100%;
    height:48px;
    border:1px solid #ddd;
    border-radius:14px;
    background:white;
    padding:0 15px;
    font-size:16px;
    outline:none;
    margin-bottom:14px;
}

.surahs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.surah{
    min-height:66px;
    background:white;
    border:1px solid #e2e2e2;
    border-radius:14px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:9px;
    text-align:right;
}

.surah:active{
    transform:scale(.97);
}

.number{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:50%;
    background:#eeeeee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
}

.info{
    flex:1;
}

.name{
    font-size:17px;
    font-weight:bold;
}

.details{
    font-size:11px;
    color:#888;
    margin-top:4px;
}

/* =========================
   قارئ المصحف
========================= */

#reader{
    display:none;
    min-height:100vh;
    background:#eeeae2;
}

.readerTop{
    position:sticky;
    top:0;
    z-index:10;
    background:#fff;
    border-bottom:1px solid #ddd;
    padding:10px;
}

.topRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.back{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#f1f1f1;
    font-size:25px;
}

.pageControl{
    display:flex;
    align-items:center;
    gap:5px;
}

#pageInput{
    width:55px;
    height:42px;
    border:1px solid #ccc;
    border-radius:11px;
    background:white;
    text-align:center;
    font-size:17px;
    outline:none;
}

.total{
    color:#777;
    font-size:13px;
}

.zoom{
    display:flex;
    gap:6px;
}

.zoom button{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#f1f1f1;
    font-size:24px;
    font-weight:bold;
}

.surahTitle{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-top:9px;
}

.pageArea{
    padding:12px 8px 20px;
    display:flex;
    justify-content:center;
    overflow:auto;
}

.pageBox{
    width:100%;
    max-width:720px;
    transform-origin:top center;
}

#quranPage{
    width:100%;
    height:auto;
    display:block;
    background:white;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

.error{
    display:none;
    text-align:center;
    padding:40px;
    color:#a00;
}

.navigation{
    display:flex;
    gap:10px;
    padding:0 12px 20px;
    justify-content:center;
}

.navigation button{
    flex:1;
    max-width:180px;
    height:48px;
    border:0;
    border-radius:13px;
    background:#fff;
    font-size:15px;
    font-weight:bold;
}

.navigation button:disabled{
    opacity:.35;
}

/* على الهاتف */
@media(max-width:380px){
    .surahs{
        grid-template-columns:1fr;
    }
}
</style>
</head>

    <div class="navigation">

/* =================================================
   عناصر الصفحة
================================================= */

const surahScreen = document.getElementById("surahScreen");
const reader = document.getElementById("reader");
const surahsBox = document.getElementById("surahs");
const search = document.getElementById("search");

const surahTitle = document.getElementById("surahTitle");
const quranPage = document.getElementById("quranPage");
const loading = document.getElementById("loading");
const error = document.getElementById("error");

const pageBox = document.getElementById("pageBox");
const pageInput = document.getElementById("pageInput");

const prev = document.getElementById("prev");
const next = document.getElementById("next");

const back = document.getElementById("back");

const zoomIn = document.getElementById("zoomIn");
const zoomOut = document.getElementById("zoomOut");


/* =================================================
   الحالة
================================================= */

let currentPage = 1;
let currentSurah = null;
let scale = 1;


/* =================================================
   إنشاء قائمة السور
================================================= */

function showSurahs(list){

    surahsBox.innerHTML = "";

    list.forEach(surah => {

        const id = surah[0];
        const name = surah[1];
        const startPage = surah[2];
        const type = surah[3];
        const ayahs = surah[4];

        const button = document.createElement("button");

        button.className = "surah";

        button.innerHTML = `
            <div class="number">${id}</div>

            <div class="info">
                <div class="name">${name}</div>
                <div class="details">
                    ${type} · ${ayahs} آية
                </div>
            </div>
        `;

        button.onclick = () => {
            openSurah(surah);
        };

        surahsBox.appendChild(button);

    });
}


/* =================================================
   فتح السورة
================================================= */

function openSurah(surah){

    currentSurah = surah;

    currentPage = surah[2];

    scale = 1;

    pageBox.style.transform = "scale(1)";

    surahScreen.style.display = "none";

    reader.style.display = "block";

    surahTitle.textContent =
        "سُورَةُ " + surah[1];

    loadPage(currentPage);

    window.scrollTo(0,0);
}


/* =================================================
   تحميل صفحة القرآن
================================================= */

function loadPage(page){

    page = Math.max(1,Math.min(604,page));

    currentPage = page;

    pageInput.value = page;

    loading.style.display = "block";

    quranPage.style.display = "none";

    error.style.display = "none";


    const url =
        "https://api.islamic.app/v1/mushaf/page/" +
        page +
        ".svg?font=uthmani&theme=light&width=720";


    quranPage.onload = function(){

        loading.style.display = "none";

        quranPage.style.display = "block";

        updateButtons();

    };


    quranPage.onerror = function(){

        loading.style.display = "none";

        quranPage.style.display = "none";

        error.style.display = "block";

    };


    quranPage.src = url;

    updateButtons();
}


/* =================================================
   أزرار الصفحات
================================================= */

function updateButtons(){

    prev.disabled = currentPage <= 1;

    next.disabled = currentPage >= 604;
}


prev.onclick = function(){

    if(currentPage > 1){
        loadPage(currentPage - 1);
    }
};


next.onclick = function(){

    if(currentPage < 604){
        loadPage(currentPage + 1);
    }
};


/* =================================================
   رقم الصفحة
================================================= */

pageInput.onchange = function(){

    let page = parseInt(pageInput.value);

    if(isNaN(page)){
        page = currentPage;
    }

    loadPage(page);
};


/* =================================================
   التكبير
================================================= */

zoomIn.onclick = function(){

    scale += 0.1;

    if(scale > 2){
        scale = 2;
    }

    pageBox.style.transform =
        "scale(" + scale + ")";
};


/* =================================================
   التصغير
================================================= */

zoomOut.onclick = function(){

    scale -= 0.1;

    if(scale < 0.7){
        scale = 0.7;
    }

    pageBox.style.transform =
        "scale(" + scale + ")";
};


/* =================================================
   العودة إلى قائمة السور
================================================= */

back.onclick = function(){

    reader.style.display = "none";

    surahScreen.style.display = "block";

    window.scrollTo(0,0);
};


/* =================================================
   البحث
================================================= */

search.oninput = function(){

    const value = search.value.trim();

    if(!value){
        showSurahs(surahs);
        return;
    }

    const result = surahs.filter(surah =>
        surah[1].includes(value) ||
        String(surah[0]).includes(value)
    );

    showSurahs(result);
};


/* =================================================
   تشغيل التطبيق
================================================= */

/*
   مهم جدًا:
   هنا لا نفتح أي سورة.
   فقط نعرض قائمة السور.

   لذلك عند ضغط:
   🔵 التطبيق المصغر

   ستكون أول شاشة هي قائمة السور الـ114.
*/

showSurahs(surahs);
