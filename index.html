<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>القرآن الكريم</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f8f7f3;
      color: #222;
      font-family: Arial, Tahoma, sans-serif;
      min-height: 100vh;
    }

    .top {
      height: 64px;
      background: #202b38;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .close {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .page-bar {
      background: white;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-bottom: 1px solid #ddd;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .page-bar button {
      background: #2589c9;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .page-bar button:disabled {
      opacity: .45;
    }

    .page-input {
      width: 70px;
      height: 45px;
      border: 1px solid #ccc;
      border-radius: 9px;
      text-align: center;
      font-size: 18px;
      outline: none;
      direction: ltr;
    }

    .page-count {
      font-size: 15px;
      color: #555;
    }

    .reader {
      width: 100%;
      min-height: calc(100vh - 125px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px 10px 30px;
    }

    .quran-page {
      width: 100%;
      max-width: 700px;
      background: #fffdf7;
      min-height: 900px;
      border: 1px solid #e2ded2;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 30px 24px;
      position: relative;
    }

    .page-number {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .content {
      font-family: "Amiri", "Traditional Arabic", Tahoma, serif;
      font-size: 24px;
      line-height: 2.2;
      text-align: justify;
    }

    .loading {
      text-align: center;
      color: #777;
      padding-top: 120px;
      font-size: 18px;
    }

    .error {
      text-align: center;
      color: #777;
      padding-top: 120px;
      font-size: 18px;
    }

    .retry {
      margin-top: 15px;
      background: #2589c9;
      color: white;
      border: 0;
      padding: 12px 22px;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .top {
        height: 58px;
      }

      .title {
        font-size: 18px;
      }

      .page-bar {
        gap: 6px;
      }

      .page-bar button {
        padding: 11px 12px;
        font-size: 14px;
      }

      .page-input {
        width: 55px;
        height: 40px;
        font-size: 16px;
      }

      .page-count {
        font-size: 13px;
      }

      .quran-page {
        min-height: calc(100vh - 150px);
        padding: 24px 16px;
      }

      .content {
        font-size: 21px;
        line-height: 2.15;
      }
    }
  </style>
</head>

<body>

  <div class="top">
    <button class="close" onclick="closeApp()">×</button>
    <div class="title">القرآن الكريم</div>
    <div style="width:42px"></div>
  </div>

  <div class="page-bar">

    <button id="nextBtn" onclick="nextPage()">
      التالية
    </button>

    <div class="page-count">
      من 604
    </div>

    <input
      id="pageInput"
      class="page-input"
      type="number"
      min="1"
      max="604"
      value="1"
      onchange="goToPage()"
    >

    <div>
      صفحة
    </div>

    <button id="prevBtn" onclick="prevPage()">
      السابقة
    </button>

  </div>

  <main class="reader">

    <div class="quran-page">

      <div id="pageNumber" class="page-number">
        الصفحة 1
      </div>

      <div id="content" class="content">
        <div class="loading">
          جارٍ تحميل الصفحة...
        </div>
      </div>

    </div>

  </main>


<script>

  // ==========================================
  // Telegram Mini App
  // ==========================================

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }


  // ==========================================
  // إعدادات القرآن
  // ==========================================

  const TOTAL_PAGES = 604;

  let currentPage = 1;


  // ==========================================
  // تحميل صفحة القرآن
  // ==========================================

  async function loadPage(page) {

    if (page < 1) page = 1;
    if (page > TOTAL_PAGES) page = TOTAL_PAGES;

    currentPage = page;

    document.getElementById("pageInput").value = page;

    document.getElementById("pageNumber").textContent =
      "الصفحة " + page;

    document.getElementById("content").innerHTML = `
      <div class="loading">
        جارٍ تحميل الصفحة...
      </div>
    `;

    updateButtons();

    try {

      /*
       * جلب آيات الصفحة من Al Quran Cloud
       */

      const response = await fetch(
        `https://api.alquran.cloud/v1/page/${page}/quran-uthmani`
      );

      if (!response.ok) {
        throw new Error("Network error");
      }

      const result = await response.json();

      if (!result.data || !result.data.ayahs) {
        throw new Error("No data");
      }

      let html = "";

      result.data.ayahs.forEach((ayah, index) => {

        html += `
          <span>
            ${ayah.text}
            <span style="
              display:inline-block;
              margin:0 5px;
              color:#777;
              font-size:16px;
            ">
              ۝${ayah.numberInSurah}
            </span>
          </span>
        `;

      });

      document.getElementById("content").innerHTML = html;

    } catch (error) {

      console.error(error);

      document.getElementById("content").innerHTML = `
        <div class="error">
          حدث خطأ في تحميل الصفحة.<br>
          حاول مرة أخرى.
          <br>
          <button class="retry" onclick="loadPage(${page})">
            إعادة المحاولة
          </button>
        </div>
      `;

    }

  }


  // ==========================================
  // الصفحة التالية
  // ==========================================

  function nextPage() {

    if (currentPage < TOTAL_PAGES) {

      loadPage(currentPage + 1);

    }

  }


  // ==========================================
  // الصفحة السابقة
  // ==========================================

  function prevPage() {

    if (currentPage > 1) {

      loadPage(currentPage - 1);

    }

  }


  // ==========================================
  // الانتقال إلى صفحة
  // ==========================================

  function goToPage() {

    let page =
      parseInt(document.getElementById("pageInput").value);

    if (isNaN(page)) {
      page = 1;
    }

    if (page < 1) {
      page = 1;
    }

    if (page > TOTAL_PAGES) {
      page = TOTAL_PAGES;
    }

    loadPage(page);

  }


  // ==========================================
  // تحديث الأزرار
  // ==========================================

  function updateButtons() {

    document.getElementById("prevBtn").disabled =
      currentPage === 1;

    document.getElementById("nextBtn").disabled =
      currentPage === TOTAL_PAGES;

  }


  // ==========================================
  // إغلاق Mini App
  // ==========================================

  function closeApp() {

    if (tg) {
      tg.close();
    } else {
      window.history.back();
    }

  }


  // ==========================================
  // تشغيل الصفحة الأولى
  // ==========================================

  loadPage(1);

</script>

</body>
</html>
