<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Quran Bot</title>

<style>

/* ==================================================
   الأساس
================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:
        Arial,
        Tahoma,
        sans-serif;
    background:#f5f3ee;
    color:#171717;
}

button,
input{
    font-family:inherit;
}


/* ==================================================
   شاشة السور
================================================== */

#surahScreen{
    display:block;
    min-height:100vh;
    padding:20px 12px 30px;
    background:#f7f7f7;
}

.header{
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    margin:5px 0 8px;
    font-size:27px;
    font-weight:700;
}

.header p{
    margin:0;
    color:#888;
    font-size:15px;
}


/* البحث */

.search{
    width:100%;
    height:50px;
    border:1px solid #dedede;
    border-radius:16px;
    background:#fff;
    outline:none;
    padding:0 17px;
    font-size:16px;
    color:#222;
    margin-bottom:15px;
}

.search::placeholder{
    color:#999;
}


/* قائمة السور */

.surahList{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.surahButton{
    background:#fff;
    border:1px solid #e2e2e2;
    border-radius:15px;
    min-height:70px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:9px;
    text-align:right;
    cursor:pointer;
}

.surahButton:active{
    transform:scale(.97);
}

.surahNumber{
    width:39px;
    height:39px;
    min-width:39px;
    border-radius:50%;
    background:#eeeeee;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:13px;
}

.surahInfo{
    flex:1;
    min-width:0;
}

.surahName{
    font-size:18px;
    font-weight:bold;
    color:#151515;
}

.surahDetails{
    color:#999;
    font-size:11px;
    margin-top:5px;
}


/* ==================================================
   قارئ القرآن
================================================== */

#reader{
    display:none;
    min-height:100vh;
    background:#f1eee7;
}


/* رأس القارئ */

.readerHeader{
    position:sticky;
    top:0;
    z-index:50;
    background:#fff;
    border-bottom:1px solid #e1e1e1;
    padding:9px 10px 11px;
}

.readerTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
}


/* الأزرار العلوية */

.topButton{
    width:44px;
    height:44px;
    min-width:44px;
    border:1px solid #dedede;
    border-radius:13px;
    background:#f5f5f5;
    color:#111;
    font-size:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.topButton:active{
    transform:scale(.94);
}


/* رقم الصفحة */

.pageControl{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    flex:1;
}

.pageInput{
    width:58px;
    height:43px;
    border:1px solid #d5d5d5;
    border-radius:12px;
    background:#fff;
    text-align:center;
    font-size:17px;
    outline:none;
    color:#222;
}

.pageText{
    color:#888;
    font-size:13px;
}


/* عنوان السورة */

.surahTitle{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-top:10px;
    color:#202020;
}


/* ==================================================
   صفحة المصحف
================================================== */

.pageArea{
    width:100%;
    padding:14px 7px 18px;
    display:flex;
    justify-content:center;
    overflow:auto;
}

.pageWrapper{
    width:100%;
    max-width:720px;
    transform-origin:top center;
    transition:transform .15s ease;
}


/* صورة المصحف */

#quranPage{
    display:none;
    width:100%;
    height:auto;
    background:#fffdf7;
    box-shadow:
        0 3px 18px rgba(0,0,0,.13);
}


/* تحميل */

.loading{
    text-align:center;
    padding:50px 10px;
    color:#888;
    font-size:15px;
}


/* الخطأ */

.error{
    display:none;
    text-align:center;
    padding:45px 15px;
    color:#a00000;
}


/* ==================================================
   أزرار السابق والتالي
================================================== */

.bottomButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:0 15px 25px;
}

.navButton{
    flex:1;
    max-width:190px;
    height:50px;
    border:0;
    border-radius:15px;
    background:#fff;
    color:#222;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 1px 5px rgba(0,0,0,.04);
    cursor:pointer;
}

.navButton:active{
    transform:scale(.97);
}

.navButton:disabled{
    opacity:.35;
}


/* ==================================================
   الوضع الليلي
================================================== */

body.dark{
    background:#101010;
    color:#f2f2f2;
}


/* شاشة السور */

body.dark #surahScreen{
    background:#101010;

body.dark .header h1{

body.dark .header p{

body.dark .search{

}

body.dark .search::placeholder{

}

body.dark .surahButton{
    background:#191919;
    border-color:#303030;
}

body.dark .surahName{

}

body.dark .surahNumber{

body.dark .surahDetails{
    color:#888;
}


/* القارئ */

body.dark #reader{
    background:#0e0e0e;
}

body.dark .readerHeader{
    background:#151515;
    border-color:#303030;
}

body.dark .topButton{
    background:#252525;
    border-color:#383838;
    color:#fff;
}

body.dark .pageInput{
    background:#222;
    border-color:#3b3b3b;
    color:#fff;
}

body.dark .pageText{
    color:#999;
}

body.dark .surahTitle{
    color:#fff;
}

body.dark .navButton{
    background:#202020;
    color:#fff;
}


/* ==================================================
   شاشة صغيرة
================================================== */

@media(max-width:380px){

    .surahList{
        grid-template-columns:1fr;
    }

    .surahName{
        font-size:17px;
    }

/* ==================================================
   شاشة كبيرة
================================================== */

@media(min-width:700px){

    .surahList{
        max-width:850px;

    }

    .search{
        max-width:850px;
        display:block;
        margin-left:auto;
        margin-right:auto;
        margin-bottom:15px;
    }

}

</style>

</head>

/* ==================================================
   العناصر
================================================== */

const surahScreen =
    document.getElementById("surahScreen");

const reader =
    document.getElementById("reader");

const surahList =
    document.getElementById("surahList");

const search =
    document.getElementById("search");

const surahTitle =
    document.getElementById("surahTitle");

const quranPage =
    document.getElementById("quranPage");

const loading =
    document.getElementById("loading");

const error =
    document.getElementById("error");

const pageInput =
    document.getElementById("pageInput");

const pageWrapper =
    document.getElementById("pageWrapper");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const backButton =
    document.getElementById("backButton");

const zoomIn =
    document.getElementById("zoomIn");

const zoomOut =
    document.getElementById("zoomOut");

const themeButton =
    document.getElementById("themeButton");


/* ==================================================
   الحالة
================================================== */

let currentPage = 1;

let currentSurah = null;

let zoom = 1;


/* ==================================================
   الوضع الليلي محفوظ
================================================== */

let darkMode =
    localStorage.getItem("quranTheme") === "dark";


function applyTheme(){

    if(darkMode){

        document.body.classList.add("dark");

        themeButton.textContent = "☀️";

        themeButton.setAttribute(
            "aria-label",
            "الوضع النهاري"
        );

    }else{

        document.body.classList.remove("dark");

        themeButton.textContent = "🌙";

        themeButton.setAttribute(
            "aria-label",
            "الوضع الليلي"
        );

    }

}


/* تشغيل الوضع */

applyTheme();


/* ==================================================
   زر الليل / النهار
================================================== */

themeButton.onclick =
function(){

    darkMode =
        !darkMode;

    localStorage.setItem(
        "quranTheme",
        darkMode
            ? "dark"
            : "light"
    );

    applyTheme();


    /*
       إذا كان المصحف مفتوحًا،
       نعيد تحميل نفس الصفحة
       حتى تتغير صفحة المصحف نفسها.
    */

    if(
        reader.style.display !== "none"
    ){

        loadPage(currentPage);

    }

};


/* ==================================================
   عرض السور
================================================== */

function renderSurahs(list){

    surahList.innerHTML = "";


    list.forEach(function(surah){

        const button =
            document.createElement("button");

        button.className =
            "surahButton";

        button.type =
            "button";


        button.innerHTML = `

            <div class="surahNumber">
                ${surah[0]}
            </div>

            <div class="surahInfo">

                <div class="surahName">
                    ${surah[1]}
                </div>

                <div class="surahDetails">
                    ${surah[3]} · ${surah[4]} آية
                </div>

            </div>

        `;


        button.onclick =
        function(){

            openSurah(surah);

        };


        surahList.appendChild(button);

    });

}


/* ==================================================
   فتح السورة
================================================== */

function openSurah(surah){

    currentSurah =
        surah;

    currentPage =
        surah[2];

    zoom =
        1;


    pageWrapper.style.transform =
        "scale(1)";


    surahScreen.style.display =
        "none";

    reader.style.display =
        "block";


    surahTitle.textContent =
        "سُورَةُ " + surah[1];


    loadPage(currentPage);


    window.scrollTo(0,0);

}


/* ==================================================
   تحميل صفحة المصحف
================================================== */

function loadPage(page){

    page =
        Math.max(
            1,
            Math.min(604,page)
        );


    currentPage =
        page;


    pageInput.value =
        page;


    loading.style.display =
        "block";

    quranPage.style.display =
        "none";

    error.style.display =
        "none";


    /*
       خط UTHMANI
       مع وضع النهار / الليل
    */

    const theme =
        document.body.classList.contains("dark")
            ? "dark"
            : "light";


    const url =
        "https://api.islamic.app/v1/mushaf/page/"
        + page
        + ".svg?font=uthmani"
        + "&theme="
        + theme
        + "&width=720";


    quranPage.onload =
    function(){

        loading.style.display =
            "none";

        quranPage.style.display =
            "block";

        updateNavigation();

    };


    quranPage.onerror =
    function(){

        loading.style.display =
            "none";

        quranPage.style.display =
            "none";

        error.style.display =
            "block";

    };


    quranPage.src =
        url;


    updateNavigation();

}


/* ==================================================
   التنقل
================================================== */

function updateNavigation(){

    prevButton.disabled =
        currentPage <= 1;

    nextButton.disabled =
        currentPage >= 604;

}


prevButton.onclick =
function(){

    if(currentPage > 1){

        loadPage(
            currentPage - 1
        );

    }

};


nextButton.onclick =
function(){

    if(currentPage < 604){

        loadPage(
            currentPage + 1
        );

    }

};


/* ==================================================
   إدخال رقم الصفحة
================================================== */

pageInput.onchange =
function(){

    let page =
        parseInt(
            pageInput.value,
            10
        );


    if(isNaN(page)){

        page =
            currentPage;

    }


    loadPage(page);

};


/* ==================================================
   التكبير
================================================== */

zoomIn.onclick =
function(){

    zoom += 0.1;


    if(zoom > 2){

        zoom = 2;

    }


    pageWrapper.style.transform =
        "scale(" + zoom + ")";

};


/* ==================================================
   التصغير
================================================== */

zoomOut.onclick =
function(){

    zoom -= 0.1;


    if(zoom < 0.7){

        zoom = 0.7;

    }


    pageWrapper.style.transform =
        "scale(" + zoom + ")";

};


/* ==================================================
   العودة إلى قائمة السور
================================================== */

backButton.onclick =
function(){

    reader.style.display =
        "none";

    surahScreen.style.display =
        "block";

    window.scrollTo(0,0);

};


/* ==================================================
   البحث
================================================== */

search.oninput =
function(){

    const value =
        search.value.trim();


    if(!value){

        renderSurahs(surahs);

        return;

    }


    const result =
        surahs.filter(
            function(surah){

                return (

                    surah[1]
                        .includes(value)

                    ||

                    String(surah[0])
                        .includes(value)

                );

            }
        );


    renderSurahs(result);

};
