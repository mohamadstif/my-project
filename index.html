<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>القرآن الكريم</title>

<!-- خط قرآني -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f3ea;
    color: #171717;
    transition: background 0.25s, color 0.25s;
}

/* =========================
   الشاشة الرئيسية
========================= */

#surahScreen {
    padding: 18px 14px 30px;
}

.header {
    text-align: center;
    margin-bottom: 18px;
}

.header h1 {
    margin: 5px 0 7px;
    font-size: 27px;
}

.header p {
    margin: 0;
    font-size: 15px;
    opacity: 0.7;
}

.searchBox {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid #ddd4c5;
    outline: none;
    font-size: 16px;
    background: white;
    color: #222;
    margin-bottom: 14px;
}

.surahList {
    display: grid;
    grid-template-columns: 1fr;
    gap: 9px;
}

.surah {
    width: 100%;
    border: 1px solid #e2dacd;
    background: white;
    border-radius: 15px;
    padding: 13px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
}

.surah:active {
    transform: scale(0.98);
}

.surahNumber {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eee7da;
    font-weight: bold;
}

.surahInfo {
    flex: 1;
    text-align: right;
    padding-right: 12px;
}

.surahName {
    font-size: 19px;
    font-weight: bold;
}

.surahEnglish {
    font-size: 12px;
    opacity: 0.55;
    margin-top: 3px;
}

.surahAyahs {
    font-size: 12px;
    opacity: 0.6;
}

/* =========================
   القارئ
========================= */

#reader {
    display: none;
    min-height: 100vh;
    background: #f7f3ea;
}

.readerTop {
    position: sticky;
    top: 0;
    z-index: 20;

    height: 58px;

    display: flex;
    align-items: center;
    gap: 7px;

    padding: 8px 10px;

    background: rgba(247,243,234,0.96);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid #ded6c8;
}

.iconButton {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 12px;

    background: #ebe4d8;
    color: #222;

    font-size: 19px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.pageInput {
    width: 70px;
    height: 40px;

    border-radius: 11px;
    border: 1px solid #d8cfbf;

    background: white;
    color: #222;

    text-align: center;
    font-size: 16px;
    outline: none;
}

.pageTotal {
    font-size: 13px;
    opacity: 0.55;
}

.readerTitle {
    flex: 1;
    text-align: center;

    font-weight: bold;
    font-size: 17px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   صفحة القرآن
========================= */

.quranPage {
    width: min(100%, 850px);
    margin: auto;

    padding: 25px 18px 110px;

    min-height: calc(100vh - 58px);
}

.pageHeader {
    text-align: center;
    margin-bottom: 20px;
}

.bismillah {
    font-family: "Amiri Quran", serif;
    font-size: 29px;
    line-height: 2.2;
    margin-bottom: 10px;
}

.pageNumberTitle {
    font-size: 13px;
    opacity: 0.5;
}

.quranText {
    font-family: "Amiri Quran", serif;

    direction: rtl;

    text-align: justify;

    font-size: 31px;
    line-height: 2.35;

    word-spacing: 2px;

    color: #171717;

    padding: 5px 4px;
}

.ayah {
    display: inline;
}

.ayahNumber {
    display: inline-flex;

    width: 31px;
    height: 31px;

    margin: 0 7px;

    border: 1px solid #9d927f;
    border-radius: 50%;

    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;
    font-size: 12px;

    vertical-align: middle;

    opacity: 0.8;
}

/* =========================
   أزرار أسفل الصفحة
========================= */

.bottomControls {
    position: fixed;
    bottom: 12px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 7px;

    border-radius: 17px;

    background: rgba(255,255,255,0.94);

    box-shadow: 0 5px 25px rgba(0,0,0,0.13);

    z-index: 30;
}

.bottomButton {
    border: none;

    min-width: 48px;
    height: 43px;

    padding: 0 12px;

    border-radius: 12px;

    background: #eee7da;

    font-size: 18px;

    cursor: pointer;
}

.bottomButton:active {
    transform: scale(0.96);
}

.zoomValue {
    font-family: Arial, sans-serif;
    font-size: 13px;
    min-width: 42px;
    text-align: center;
}

/* =========================
   تحميل
========================= */

.loading {
    text-align: center;
    padding: 70px 20px;

    font-size: 18px;

    opacity: 0.6;
}

.error {
    text-align: center;
    padding: 50px 20px;

    line-height: 2;
}

/* =========================
   الوضع الليلي
========================= */

body.dark {
    background: #111;
    color: #eee;
}

body.dark #reader {
    background: #111;
}

body.dark .readerTop {
    background: rgba(17,17,17,0.96);
    border-color: #292929;
}

body.dark .iconButton {
    background: #242424;
    color: #eee;
}

body.dark .pageInput {
    background: #202020;
    border-color: #383838;
    color: #eee;
}

body.dark .quranText {
    color: #f1eee8;
}

body.dark .ayahNumber {
    border-color: #777;
}

body.dark .surah {
    background: #1b1b1b;
    border-color: #2d2d2d;
}

body.dark .surahNumber {
    background: #292929;
}

body.dark .searchBox {
    background: #1b1b1b;
    border-color: #333;
    color: #eee;
}

body.dark .bottomControls {
    background: rgba(28,28,28,0.95);
}

body.dark .bottomButton {
    background: #292929;
    color: #eee;
}

/* =========================
   الشاشات الصغيرة
========================= */

@media (max-width: 600px) {

    .quranPage {
        padding-left: 13px;
        padding-right: 13px;
    }

    .quranText {
        font-size: 27px;
        line-height: 2.35;
    }

    .bismillah {
        font-size: 26px;
    }

    .readerTitle {
        font-size: 15px;
    }
}

</style>
</head>

<body>

<!-- ==================================================
     قائمة السور
================================================== -->

<section id="surahScreen">

    <div class="header">
        <h1>📖 القرآن الكريم</h1>
        <p>اختر السورة التي تريد قراءتها</p>
    </div>

    <input
        id="search"
        class="searchBox"
        type="search"
        placeholder="🔎 ابحث عن سورة..."
        autocomplete="off"
    >

    <div id="surahList" class="surahList"></div>

</section>


<!-- ==================================================
     القارئ
================================================== -->

<section id="reader">

    <div class="readerTop">

        <button
            id="backButton"
            class="iconButton"
            title="العودة"
        >
            ←
        </button>

        <input
            id="pageInput"
            class="pageInput"
            type="number"
            min="1"
            max="604"
            value="1"
        >

        <span class="pageTotal">/ 604</span>

        <div id="readerTitle" class="readerTitle">
            القرآن الكريم
        </div>

        <button
            id="themeButton"
            class="iconButton"
            title="الوضع الليلي"
        >
            🌙
        </button>

    </div>


    <main class="quranPage">

        <div id="pageContent">

            <div class="loading">
                جاري تحميل الصفحة...
            </div>

        </div>

    </main>


    <div class="bottomControls">

        <button
            id="prevButton"
            class="bottomButton"
        >
            ‹
        </button>

        <button
            id="zoomOut"
            class="bottomButton"
        >
            −
        </button>

        <span
            id="zoomValue"
            class="zoomValue"
        >
            100%
        </span>

        <button
            id="zoomIn"
            class="bottomButton"
        >
            +
        </button>

        <button
            id="nextButton"
            class="bottomButton"
        >
            ›
        </button>

    </div>

</section>


<script>

/* ==================================================

const surahs = [

["العاديات","Al-Adiyat",11,599],
["القارعة","Al-Qariah",11,600],
["التكاثر","At-Takathur",8,600],

["الهمزة","Al-Humazah",9,601],

["الماعون","Al-Maun",7,602],
["الكوثر","Al-Kawthar",3,602],
["الكافرون","Al-Kafirun",6,603],
["النصر","An-Nasr",3,603],
["المسد","Al-Masad",5,603],
["الإخلاص","Al-Ikhlas",4,604],
["الفلق","Al-Falaq",5,604],
["الناس","An-Nas",6,604]
];


/* ==================================================
   العناصر
================================================== */

const surahScreen = document.getElementById("surahScreen");
const surahList = document.getElementById("surahList");
const search = document.getElementById("search");

const reader = document.getElementById("reader");
const pageContent = document.getElementById("pageContent");

const pageInput = document.getElementById("pageInput");
const readerTitle = document.getElementById("readerTitle");

const backButton = document.getElementById("backButton");
const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");

const themeButton = document.getElementById("themeButton");

const zoomOut = document.getElementById("zoomOut");
const zoomIn = document.getElementById("zoomIn");
const zoomValue = document.getElementById("zoomValue");


/* ==================================================
   الحالة
================================================== */

let currentPage = 1;
let currentSurah = null;

let zoom = 100;


/* ==================================================
   إنشاء قائمة السور
================================================== */

function renderSurahs(filter = "") {

    surahList.innerHTML = "";

    const text = filter.trim().toLowerCase();

    surahs.forEach((surah, index) => {

        const arabicName = surah[0];
        const englishName = surah[1];

        if (
            text &&
            !arabicName.includes(text) &&
            !englishName.toLowerCase().includes(text)
        ) {
            return;
        }

        const button = document.createElement("div");

        button.className = "surah";

        button.innerHTML = `
            <div class="surahNumber">${index + 1}</div>

            <div class="surahInfo">
                <div class="surahName">${arabicName}</div>
                <div class="surahEnglish">${englishName}</div>
            </div>

            <div class="surahAyahs">
                ${surah[2]} آية
            </div>
        `;

        button.addEventListener("click", () => {

            currentSurah = index;

            currentPage = surah[3];

            readerTitle.textContent =
                "سورة " + surah[0];

            surahScreen.style.display = "none";
            reader.style.display = "block";

            pageInput.value = currentPage;

            loadPage(currentPage);

            window.scrollTo(0, 0);
        });

        surahList.appendChild(button);

    });
}

renderSurahs();


/* ==================================================
   البحث
================================================== */

search.addEventListener("input", () => {

    renderSurahs(search.value);

});


/* ==================================================
   تحميل صفحة القرآن
================================================== */

async function loadPage(page) {

    page = Math.max(1, Math.min(604, Number(page)));

    currentPage = page;

    pageInput.value = page;

    pageContent.innerHTML = `
        <div class="loading">
            جاري تحميل الصفحة ${page}...
        </div>
    `;

    try {

        const url =
            "https://api.quran.com/api/v4/verses/by_page/"
            + page
            + "?fields=text_uthmani,verse_number,chapter_id"
            + "&per_page=50";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("API error");
        }

        const data = await response.json();

        if (
            !data ||
            !data.verses ||
            data.verses.length === 0
        ) {
            throw new Error("No verses");
        }

        renderPage(data.verses);

    } catch (error) {

        console.error(error);

        pageContent.innerHTML = `
            <div class="error">
                ⚠️ تعذر تحميل الصفحة حاليًا.
                <br>
                تأكد من اتصال الإنترنت ثم اضغط على رقم الصفحة مرة أخرى.
                <br><br>
                <button
                    onclick="loadPage(${page})"
                    class="bottomButton"
                >
                    إعادة المحاولة
                </button>
            </div>
        `;

    }

}


/* ==================================================
   عرض الآيات
================================================== */

function renderPage(verses) {

    let html = "";

    let lastChapter = null;

    verses.forEach((verse, index) => {

        const chapterId = verse.chapter_id;

        /*
         * عنوان السورة عند بداية سورة جديدة
         */
        if (chapterId !== lastChapter) {

            const chapter =
                surahs[chapterId - 1];

            if (chapter) {

                html += `
                    <div class="pageHeader">

                        <div class="bismillah">
                            ${chapterId !== 9 && chapterId !== 1
                                ? "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ"
                                : ""}
                        </div>

                        <div class="pageNumberTitle">
                            سورة ${chapter[0]}
                        </div>

                    </div>
                `;

            }

            lastChapter = chapterId;
        }


        let text =
            verse.text_uthmani || "";

        /*
         * إزالة أي رقم آية موجود داخل النص
         * لأننا نضيف دائرة خاصة بنا.
         */
        text = text.replace(/\s*\(\d+\)\s*$/g, "");


        html += `
            <span class="ayah">
                ${text}
                <span class="ayahNumber">
                    ${verse.verse_number}
                </span>
            </span>
        `;

    });


    pageContent.innerHTML = `
        <div class="quranText">
            ${html}
        </div>
    `;

    applyZoom();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ==================================================
   الصفحات السابقة والتالية
================================================== */

prevButton.addEventListener("click", () => {

    if (currentPage > 1) {
        loadPage(currentPage - 1);
    }

});


nextButton.addEventListener("click", () => {

    if (currentPage < 604) {
        loadPage(currentPage + 1);
    }

});


/* ==================================================
   إدخال رقم الصفحة
================================================== */

pageInput.addEventListener("change", () => {

    let page =
        parseInt(pageInput.value);

    if (
        isNaN(page) ||
        page < 1 ||
        page > 604
    ) {
        page = currentPage;
    }

    loadPage(page);

});


pageInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {

        pageInput.blur();

    }

});


/* ==================================================
   الرجوع لقائمة السور
================================================== */

backButton.addEventListener("click", () => {

    reader.style.display = "none";
    surahScreen.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

});


/* ==================================================
   الوضع الليلي / النهاري
================================================== */

function applyTheme() {

    const dark =
        localStorage.getItem("quranTheme") === "dark";

    document.body.classList.toggle(
        "dark",
        dark
    );

    themeButton.textContent =
        dark ? "☀️" : "🌙";

}


themeButton.addEventListener("click", () => {

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "quranTheme",
        dark ? "light" : "dark"
    );

    applyTheme();

});


applyTheme();


/* ==================================================
   التكبير والتصغير
================================================== */

function applyZoom() {

    const text =
        document.querySelector(".quranText");

    if (!text) return;

    text.style.fontSize =
        zoom + "%";

    zoomValue.textContent =
        zoom + "%";
}


zoomIn.addEventListener("click", () => {

    if (zoom < 150) {

        zoom += 10;

        applyZoom();

    }

});


zoomOut.addEventListener("click", () => {

    if (zoom > 70) {

        zoom -= 10;

        applyZoom();

    }

});


/* ==================================================
   دعم أزرار لوحة المفاتيح
================================================== */

document.addEventListener("keydown", (event) => {

    if (
        reader.style.display !== "none" &&
        event.key === "ArrowRight"
    ) {
        loadPage(currentPage + 1);
    }

    if (
        reader.style.display !== "none" &&
        event.key === "ArrowLeft"
    ) {
        loadPage(currentPage - 1);
    }

});

</script>

</body>
</html>
