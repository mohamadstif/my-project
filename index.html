<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Quran Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f4f4f4;
    color:#222;
    font-family:Arial,Tahoma,sans-serif;
}

button,input{
    font-family:inherit;
}

/* =====================================
   شاشة اختيار السورة
===================================== */

#surahScreen{
    display:block;
    min-height:100vh;
    padding:20px 12px 30px;
    background:#f5f5f5;
}

.header{
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    margin:5px 0 8px;
    font-size:25px;
}

.header p{
    margin:0;
    color:#777;
    font-size:14px;
}

.search{
    width:100%;
    height:48px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#fff;
    outline:none;
    padding:0 15px;
    font-size:16px;
    margin-bottom:15px;
}

.surahList{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.surahButton{
    background:#fff;
    border:1px solid #e1e1e1;
    border-radius:14px;
    min-height:68px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:9px;
    text-align:right;
}

.surahButton:active{
    transform:scale(.97);
}

.surahNumber{
    width:37px;
    height:37px;
    min-width:37px;
    border-radius:50%;
    background:#eeeeee;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:13px;
}

.surahInfo{
    flex:1;
    min-width:0;
}

.surahName{
    font-size:17px;
    font-weight:bold;
}

.surahDetails{
    color:#888;
    font-size:11px;
    margin-top:4px;
}


/* =====================================
   شاشة المصحف
===================================== */

#reader{
    display:none;
    min-height:100vh;
    background:#ece9e2;
}

.readerHeader{
    position:sticky;
    top:0;
    z-index:20;
    background:#fff;
    border-bottom:1px solid #ddd;
    padding:9px 10px;
}

.readerTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:7px;
}

.backButton{
    width:43px;
    height:43px;
    border:0;
    border-radius:12px;
    background:#eeeeee;
    font-size:27px;
}

.pageControl{
    display:flex;
    align-items:center;
    gap:5px;
}

.pageInput{
    width:57px;
    height:42px;
    border:1px solid #ccc;
    border-radius:11px;
    background:#fff;
    text-align:center;
    font-size:17px;
    outline:none;
}

.pageText{
    color:#777;
    font-size:13px;
}

.zoomControls{
    display:flex;
    gap:5px;
}

.zoomButton{
    width:43px;
    height:43px;
    border:0;
    border-radius:12px;
    background:#eeeeee;
    font-size:25px;
    font-weight:bold;
}

.surahTitle{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-top:9px;
}

.pageArea{
    width:100%;
    padding:12px 8px 18px;
    display:flex;
    justify-content:center;
    overflow:auto;
}

.pageWrapper{
    width:100%;
    max-width:720px;
    transform-origin:top center;
}

#quranPage{
    display:none;
    width:100%;
    height:auto;
    background:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.loading{
    text-align:center;
    padding:45px 10px;
    color:#777;
}

.error{
    display:none;
    text-align:center;
    padding:40px 15px;
    color:#a00000;
}

.bottomButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:0 12px 20px;
}

.navButton{
    flex:1;
    max-width:180px;
    height:48px;
    border:0;
    border-radius:13px;
    background:#fff;
    font-size:15px;
    font-weight:bold;
}

.navButton:disabled{
    opacity:.35;
}

@media(max-width:380px){

    .surahList{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     الشاشة الأولى
     تظهر عند فتح التطبيق المصغر
     ================================================== -->

<section id="surahScreen">

    <div class="header">

        <h1>📖 القرآن الكريم</h1>

        <p>
            اختر السورة التي تريد قراءتها
        </p>

    </div>


    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 ابحث عن السورة"
        autocomplete="off"
    >


    <div
        id="surahList"
        class="surahList">
    </div>

</section>



<!-- ==================================================
     شاشة قارئ القرآن
     مخفية في البداية
     ================================================== -->

<section id="reader">


    <div class="readerHeader">

        <div class="readerTop">


            <!-- العودة إلى السور -->

            <button
                id="backButton"
                class="backButton">
                ‹
            </button>


            <!-- رقم الصفحة -->

            <div class="pageControl">

                <input
                    id="pageInput"
                    class="pageInput"
                    type="number"
                    min="1"
                    max="604"
                    value="1"
                >

                <span class="pageText">
                    من 604
                </span>

            </div>


            <!-- التكبير والتصغير -->

            <div class="zoomControls">

                <button
                    id="zoomOut"
                    class="zoomButton">
                    −
                </button>

                <button
                    id="zoomIn"
                    class="zoomButton">
                    +
                </button>

            </div>

        </div>


        <div
            id="surahTitle"
            class="surahTitle">
        </div>

    </div>



    <!-- صفحة القرآن -->

    <div class="pageArea">

        <div
            id="pageWrapper"
            class="pageWrapper">

            <div
                id="loading"
                class="loading">

                جاري تحميل صفحة المصحف...

            </div>


            <img
                id="quranPage"
                alt="صفحة القرآن">


            <div
                id="error"
                class="error">

                حدث خطأ في تحميل صفحة المصحف.

                <br><br>

                حاول مرة أخرى.

            </div>

        </div>

    </div>



    <!-- السابق والتالي -->

    <div class="bottomButtons">

        <button
            id="prevButton"
            class="navButton">

            ‹ السابقة

        </button>


        <button
            id="nextButton"
            class="navButton">

            التالية ›

        </button>

    </div>


</section>

[114,"الناس",604,"مكية",6]

];


/* ==================================================
   العناصر
================================================== */

const surahScreen =
    document.getElementById("surahScreen");

const reader =
    document.getElementById("reader");

const surahList =
    document.getElementById("surahList");

const search =
    document.getElementById("search");

const surahTitle =
    document.getElementById("surahTitle");

const quranPage =
    document.getElementById("quranPage");

const loading =
    document.getElementById("loading");

const error =
    document.getElementById("error");

const pageInput =
    document.getElementById("pageInput");

const pageWrapper =
    document.getElementById("pageWrapper");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const backButton =
    document.getElementById("backButton");

const zoomIn =
    document.getElementById("zoomIn");

const zoomOut =
    document.getElementById("zoomOut");


/* ==================================================
   الحالة الحالية
================================================== */

let currentPage = 1;

let currentSurah = null;

let zoom = 1;


/* ==================================================
   عرض السور
================================================== */

function renderSurahs(list){

    surahList.innerHTML = "";

    list.forEach(function(surah){

        const button =
            document.createElement("button");

        button.className =
            "surahButton";

        button.type =
            "button";


        button.innerHTML = `

            <div class="surahNumber">
                ${surah[0]}
            </div>

            <div class="surahInfo">

                <div class="surahName">
                    ${surah[1]}
                </div>

                <div class="surahDetails">
                    ${surah[3]} · ${surah[4]} آية
                </div>

            </div>

        `;


        button.onclick = function(){

            openSurah(surah);

        };


        surahList.appendChild(button);

    });

}


/* ==================================================
   فتح السورة
================================================== */

function openSurah(surah){

    currentSurah =
        surah;

    currentPage =
        surah[2];

    zoom =
        1;


    pageWrapper.style.transform =
        "scale(1)";


    /*
       الآن فقط ننتقل إلى قارئ القرآن
    */

    surahScreen.style.display =
        "none";

    reader.style.display =
        "block";


    surahTitle.textContent =
        "سُورَةُ " + surah[1];


    loadPage(currentPage);


    window.scrollTo(0,0);

}


/* ==================================================
   تحميل صفحة المصحف
================================================== */

function loadPage(page){

    page =
        Math.max(
            1,
            Math.min(604,page)
        );


    currentPage =
        page;


    pageInput.value =
        page;


    loading.style.display =
        "block";

    quranPage.style.display =
        "none";

    error.style.display =
        "none";


    const url =
        "https://api.islamic.app/v1/mushaf/page/"
        + page
        + ".svg?font=uthmani&theme=light&width=720";


    quranPage.onload =
        function(){

            loading.style.display =
                "none";

            quranPage.style.display =
                "block";

            updateNavigation();

        };


    quranPage.onerror =
        function(){

            loading.style.display =
                "none";

            quranPage.style.display =
                "none";

            error.style.display =
                "block";

        };


    quranPage.src =
        url;


    updateNavigation();

}


/* ==================================================
   السابق والتالي
================================================== */

function updateNavigation(){

    prevButton.disabled =
        currentPage <= 1;

    nextButton.disabled =
        currentPage >= 604;

}


prevButton.onclick =
    function(){

        if(currentPage > 1){

            loadPage(
                currentPage - 1
            );

        }

    };


nextButton.onclick =
    function(){

        if(currentPage < 604){

            loadPage(
                currentPage + 1
            );

        }

    };


/* ==================================================
   رقم الصفحة
================================================== */

pageInput.onchange =
    function(){

        let page =
            parseInt(
                pageInput.value,
                10
            );


        if(isNaN(page)){

            page =
                currentPage;

        }


        loadPage(page);

    };


/* ==================================================
   التكبير
================================================== */

zoomIn.onclick =
    function(){

        zoom += 0.1;


        if(zoom > 2){

            zoom = 2;

        }


        pageWrapper.style.transform =
            "scale(" + zoom + ")";

    };


/* ==================================================
   التصغير
================================================== */

zoomOut.onclick =
    function(){

        zoom -= 0.1;


        if(zoom < 0.7){

            zoom = 0.7;

        }


        pageWrapper.style.transform =
            "scale(" + zoom + ")";

    };


/* ==================================================
   العودة لقائمة السور
================================================== */

backButton.onclick =
    function(){

        reader.style.display =
            "none";

        surahScreen.style.display =
            "block";

        window.scrollTo(0,0);

    };


/* ==================================================
   البحث
================================================== */

search.oninput =
    function(){

        const value =
            search.value.trim();


        if(!value){

            renderSurahs(surahs);

            return;

        }


        const result =
            surahs.filter(
                function(surah){

                    return (
                        surah[1].includes(value)
                        ||
                        String(surah[0])
                            .includes(value)
                    );

                }
            );


        renderSurahs(result);

    };


/* ==================================================
   تشغيل التطبيق
================================================== */

/*
   مهم جدًا:

   لا يوجد هنا:
   openSurah(...)
   ولا:
   loadPage(...)

   لذلك عند فتح التطبيق المصغر
   تظهر قائمة السور فقط.
*/

renderSurahs(surahs);

</script>

</body>
</html>
