<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=5.0,
      user-scalable=yes">

<title>تجربة</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f7f6f2;
    font-family: Arial, Tahoma, sans-serif;
}


/* =========================
   الهيدر
========================= */

.header {

    height: 64px;

    background: #202c38;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    position: sticky;

    top: 0;

    z-index: 100;

}

.title {

    font-size: 22px;

    font-weight: bold;

}

.close {

    width: 44px;

    height: 44px;

    border: none;

    background: transparent;

    color: white;

    font-size: 38px;

    line-height: 1;

    cursor: pointer;

}


/* =========================
   شريط التحكم
========================= */

.controls {

    height: 86px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 10px;

    border-bottom: 1px solid #ddd;

    box-shadow: 0 2px 7px rgba(0,0,0,.08);

    position: sticky;

    top: 64px;

    z-index: 90;

}

.nav-btn {

    min-width: 105px;

    height: 52px;

    border: none;

    border-radius: 10px;

    background: #258dcc;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}

.nav-btn:active {

    transform: scale(.97);

}

.nav-btn:disabled {

    background: #add5e9;

    cursor: default;

}

.page-input {

    width: 70px;

    height: 50px;

    border: 1px solid #ccc;

    border-radius: 10px;

    text-align: center;

    font-size: 20px;

    outline: none;

    direction: ltr;

}

.page-input:focus {

    border-color: #258dcc;

}

.page-text {

    font-size: 17px;

    white-space: nowrap;

}


/* =========================
   منطقة المصحف
========================= */

.reader {

    width: 100%;

    padding: 18px 10px 40px;

    display: flex;

    justify-content: center;

    overflow: hidden;

}


/* =========================
   صفحة المصحف
========================= */

.mushaf {

    width: 100%;

    max-width: 720px;

    background: #fffdf8;

    border: 1px solid #dedbd3;

    box-shadow: 0 2px 14px rgba(0,0,0,.10);

    position: relative;

    overflow: hidden;

}


/* صورة المصحف */

#quranPage {

    display: block;

    width: 100%;

    height: auto;

    margin: 0;

    padding: 0;

    user-select: none;

    -webkit-user-drag: none;

}


/* =========================
   التحميل
========================= */

.loading {

    min-height: 700px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #777;

    font-size: 19px;

    text-align: center;

    padding: 30px;

}


/* دائرة التحميل */

.spinner {

    width: 36px;

    height: 36px;

    border: 4px solid #ddd;

    border-top-color: #258dcc;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin-bottom: 18px;

}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   الخطأ
========================= */

.error {

    min-height: 500px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #777;

    text-align: center;

    font-size: 18px;

    line-height: 2;

    padding: 30px;

}

.retry {

    margin-top: 15px;

    padding: 12px 25px;

    background: #258dcc;

    color: white;

    border: none;

    border-radius: 9px;

    font-size: 16px;

}


/* =========================
   الهاتف
========================= */

@media (max-width: 600px) {

    .header {

        height: 58px;

    }

    .controls {

        height: 82px;

        top: 58px;

        gap: 5px;

        padding: 8px 5px;

    }

    .nav-btn {

        min-width: 86px;

        height: 48px;

        padding: 0 8px;

        font-size: 15px;

    }

    .page-input {

        width: 58px;

        height: 46px;

        font-size: 18px;

    }

    .page-text {

        font-size: 14px;

    }

    .reader {

        padding: 10px 6px 30px;

    }

    .mushaf {

        width: 100%;

    }

}


/* =========================
   السحب
========================= */

.mushaf {

    touch-action: pan-y pinch-zoom;

}

</style>

</head>


<body>


<!-- =========================
     الهيدر
========================= -->

<header class="header">

    <button
        class="close"
        onclick="closeApp()">

        ×

    </button>


    <div class="title">

        تجربة

    </div>


    <div style="width:44px;"></div>

</header>



<!-- =========================
     أزرار الصفحات
========================= -->

<div class="controls">


    <button
        id="nextBtn"
        class="nav-btn"
        onclick="nextPage()">

        التالية

    </button>


    <span class="page-text">

        من 604

    </span>


    <input
        id="pageInput"
        class="page-input"
        type="number"
        min="1"
        max="604"
        value="1"
        inputmode="numeric"
        onchange="goToPage()"
    >


    <span class="page-text">

        صفحة

    </span>


    <button
        id="prevBtn"
        class="nav-btn"
        onclick="prevPage()">

        السابقة

    </button>


</div>



<!-- =========================
     المصحف
========================= -->

<main class="reader">

    <div
        id="mushaf"
        class="mushaf">


        <div
            id="loading"
            class="loading">

            <div class="spinner"></div>

            جارٍ تحميل الصفحة...

        </div>


        <img
            id="quranPage"
            alt="صفحة القرآن الكريم"
            style="display:none;"
        >


    </div>

</main>



<script>

/* =====================================
   Telegram Mini App
===================================== */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}



/* =====================================
   الإعدادات
===================================== */

const TOTAL_PAGES = 604;

let currentPage = 1;


/* =====================================
   عناصر الصفحة
===================================== */

const img =
    document.getElementById("quranPage");

const loading =
    document.getElementById("loading");

const pageInput =
    document.getElementById("pageInput");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");



/* =====================================
   رابط صفحة القرآن
===================================== */

function getPageUrl(page) {

    return (
        "https://api.islamic.app/v1/mushaf/page/"
        + page
        + ".svg"
        + "?font=uthmani"
        + "&theme=light"
        + "&width=720"
    );

}



/* =====================================
   تحميل صفحة
===================================== */

function loadPage(page, save = true) {

    page = parseInt(page);

    if (isNaN(page)) {
        page = 1;
    }

    if (page < 1) {
        page = 1;
    }

    if (page > TOTAL_PAGES) {
        page = TOTAL_PAGES;
    }


    currentPage = page;

    pageInput.value = page;


    /* إظهار التحميل */

    loading.style.display = "flex";

    loading.innerHTML = `
        <div class="spinner"></div>
        جارٍ تحميل الصفحة ${page}...
    `;


    img.style.display = "none";


    /* تحديث الأزرار */

    updateButtons();


    /* رابط الصفحة */

    const url =
        getPageUrl(page);


    /* تحميل الصورة */

    img.onload = function () {

        loading.style.display = "none";

        img.style.display = "block";

    };


    img.onerror = function () {

        loading.innerHTML = `

            <div>
                تعذر تحميل صفحة المصحف.
                <br>
                تأكد من اتصال الإنترنت.
            </div>

            <button
                class="retry"
                onclick="loadPage(${page})">

                إعادة المحاولة

            </button>

        `;

    };


    img.src = url;


    /* حفظ آخر صفحة */

    if (save) {

        localStorage.setItem(
            "lastQuranPage",
            page
        );

    }


    /* تغيير الرابط بدون إعادة تحميل */

    try {

        history.replaceState(
            null,
            "",
            "#page=" + page
        );

    } catch(e) {}

}



/* =====================================
   التالية
===================================== */

function nextPage() {

    if (currentPage < TOTAL_PAGES) {

        loadPage(
            currentPage + 1
        );

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}



/* =====================================
   السابقة
===================================== */

function prevPage() {

    if (currentPage > 1) {

        loadPage(
            currentPage - 1
        );

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}



/* =====================================
   الذهاب إلى صفحة
===================================== */

function goToPage() {

    let page =
        parseInt(
            pageInput.value
        );


    if (isNaN(page)) {

        page = currentPage;

    }


    loadPage(page);


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =====================================
   تحديث الأزرار
===================================== */

function updateButtons() {

    prevBtn.disabled =
        currentPage <= 1;


    nextBtn.disabled =
        currentPage >= TOTAL_PAGES;

}



/* =====================================
   إغلاق Mini App
===================================== */

function closeApp() {

    if (tg) {

        tg.close();

    } else {

        window.history.back();

    }

}



/* =====================================
   السحب يمين / يسار
===================================== */

let touchStartX = 0;

let touchStartY = 0;


document
.getElementById("mushaf")
.addEventListener(
    "touchstart",
    function(e) {

        if (!e.touches.length)
            return;

        touchStartX =
            e.touches[0].clientX;

        touchStartY =
            e.touches[0].clientY;

    },
    {passive:true}
);


document
.getElementById("mushaf")
.addEventListener(
    "touchend",
    function(e) {

        if (!e.changedTouches.length)
            return;

        const endX =
            e.changedTouches[0].clientX;

        const endY =
            e.changedTouches[0].clientY;


        const diffX =
            endX - touchStartX;

        const diffY =
            endY - touchStartY;


        /*
           نتأكد أن الحركة أفقية
           وليست تمريرًا للأعلى والأسفل
        */

        if (
            Math.abs(diffX) > 70 &&
            Math.abs(diffX) > Math.abs(diffY)
        ) {

            if (diffX < 0) {

                /*
                   سحب لليسار
                   الصفحة التالية
                */

                nextPage();

            } else {

                /*
                   سحب لليمين
                   الصفحة السابقة
                */

                prevPage();

            }

        }

    },
    {passive:true}
);



/* =====================================
   استرجاع آخر صفحة
===================================== */

function getInitialPage() {

    /* من الرابط */

    const hash =
        window.location.hash;


    const match =
        hash.match(
            /page=(\d+)/
        );


    if (match) {

        const page =
            parseInt(match[1]);

        if (
            page >= 1 &&
            page <= TOTAL_PAGES
        ) {

            return page;

        }

    }


    /* من التخزين */

    const saved =
        parseInt(
            localStorage.getItem(
                "lastQuranPage"
            )
        );


    if (
        !isNaN(saved) &&
        saved >= 1 &&
        saved <= TOTAL_PAGES
    ) {

        return saved;

    }


    return 1;

}



/* =====================================
   تشغيل
===================================== */

loadPage(
    getInitialPage(),
    false
);

</script>

</body>

</html>
