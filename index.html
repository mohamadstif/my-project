<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>القرآن الكريم</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f8f7f3;
    font-family:Arial,Tahoma,sans-serif;
}

.top{
    height:64px;
    background:#202b38;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    position:sticky;
    top:0;
    z-index:20;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.close{
    border:0;
    background:none;
    color:white;

    font-size:38px;
    line-height:1;

    padding:0;
}

.pagebar{

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    padding:16px 10px;

    border-bottom:1px solid #ddd;

    position:sticky;
    top:64px;

    z-index:10;
}

.pagebtn{

    background:#2589c9;

    color:white;

    border:0;

    border-radius:10px;

    padding:14px 20px;

    font-size:16px;

    font-weight:bold;
}

.pagebtn:disabled{
    opacity:.4;
}

.pageinput{

    width:64px;

    height:46px;

    border:1px solid #ccc;

    border-radius:9px;

    text-align:center;

    font-size:18px;

    outline:none;
}

.reader{

    width:100%;

    padding:12px;

    display:flex;

    justify-content:center;
}

.mushaf{

    width:100%;

    max-width:700px;

    background:#fffdf7;

    min-height:600px;

    border:1px solid #e0ddd5;

    box-shadow:
    0 2px 10px rgba(0,0,0,.08);

    overflow:hidden;

    text-align:center;
}

.mushaf img{

    width:100%;

    height:auto;

    display:block;

    margin:auto;

    user-select:none;

    -webkit-user-drag:none;
}

.loading{

    padding-top:120px;

    padding-bottom:120px;

    color:#777;

    font-size:18px;
}

.error{

    padding:100px 20px;

    color:#777;

    font-size:18px;

    line-height:2;
}

.retry{

    margin-top:15px;

    background:#2589c9;

    color:white;

    border:0;

    border-radius:9px;

    padding:12px 25px;

    font-size:16px;
}

@media(max-width:600px){

    .top{
        height:58px;
    }

    .pagebar{
        top:58px;
        padding:12px 6px;
    }

    .pagebtn{
        padding:12px 13px;
        font-size:14px;
    }

    .pageinput{
        width:55px;
        height:42px;
    }

}

</style>

</head>

<body>


<div class="top">

    <button
        class="close"
        onclick="closeApp()">
        ×
    </button>

    <div class="title">
        تجربة
    </div>

    <div style="width:40px"></div>

</div>



<div class="pagebar">

    <button
        id="next"
        class="pagebtn"
        onclick="nextPage()">

        التالية

    </button>


    <span>
        من 604
    </span>


    <input
        id="page"
        class="pageinput"
        type="number"
        min="1"
        max="604"
        value="1"
        onchange="jumpPage()"
    >


    <span>
        صفحة
    </span>


    <button
        id="prev"
        class="pagebtn"
        onclick="prevPage()">

        السابقة

    </button>

</div>



<div class="reader">

    <div class="mushaf">

        <div
            id="loading"
            class="loading">

            جارٍ تحميل الصفحة...

        </div>


        <img
            id="quranPage"
            style="display:none"
            alt="صفحة القرآن"
        >

    </div>

</div>



<script>

const TOTAL_PAGES = 604;

let currentPage = 1;


/* Telegram */

const tg = window.Telegram?.WebApp;

if(tg){

    tg.ready();

    tg.expand();

}


/* ==================================
   تحميل صفحة المصحف
================================== */

function loadPage(page){

    if(page < 1)
        page = 1;

    if(page > TOTAL_PAGES)
        page = TOTAL_PAGES;


    currentPage = page;


    document.getElementById("page").value =
        page;


    document.getElementById("loading").style.display =
        "block";


    document.getElementById("loading").innerHTML =
        "جارٍ تحميل الصفحة...";


    document.getElementById("quranPage").style.display =
        "none";


    updateButtons();


    /*
       مصدر صفحات المصحف
       001 إلى 604
    */

    const pageNumber =
        String(page).padStart(3,"0");


    const imageURL =
        "https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main/pages/"
        + pageNumber
        + ".json";


    /*
       هنا نجلب بيانات الصفحة
    */

    fetch(imageURL)

    .then(response => {

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        return response.json();

    })

    .then(data => {

        showPage(data);

    })

    .catch(error => {

        console.error(error);

        document.getElementById("loading").innerHTML = `

            حدث خطأ في تحميل الصفحة.

            <br>

            <button
                class="retry"
                onclick="loadPage(${page})">

                إعادة المحاولة

            </button>

        `;

    });

}


/* ==================================
   عرض الصفحة
================================== */

function showPage(data){

    const img =
        document.getElementById("quranPage");


    /*
       هذا الجزء مؤقت
       ويعرض رسالة نجاح إذا تم
       جلب بيانات الصفحة
    */

    document.getElementById("loading").innerHTML =

        "تم تحميل بيانات الصفحة " +
        currentPage;


    /*
       إظهار الصورة إن كان المصدر
       يحتوي على رابط صورة
    */

    if(data.image){

        img.src = data.image;

        img.onload = function(){

            document.getElementById("loading")
                .style.display = "none";

            img.style.display = "block";

        };

    }

}


/* ==================================
   التالية
================================== */

function nextPage(){

    if(currentPage < TOTAL_PAGES){

        loadPage(currentPage + 1);

    }

}


/* ==================================
   السابقة
================================== */

function prevPage(){

    if(currentPage > 1){

        loadPage(currentPage - 1);

    }

}


/* ==================================
   الانتقال لصفحة
================================== */

function jumpPage(){

    let page =
        parseInt(
            document.getElementById("page").value
        );


    if(isNaN(page))
        page = 1;


    loadPage(page);

}


/* ==================================
   الأزرار
================================== */

function updateButtons(){

    document.getElementById("prev").disabled =
        currentPage === 1;


    document.getElementById("next").disabled =
        currentPage === TOTAL_PAGES;

}


/* ==================================
   إغلاق التطبيق
================================== */

function closeApp(){

    if(tg){

        tg.close();

    }else{

        history.back();

    }

}


/* تشغيل الصفحة الأولى */

loadPage(1);

</script>

</body>
</html>
